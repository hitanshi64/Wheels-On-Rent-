{% extends "base.html" %}

{% block title %}Account Login | WheelsOnRent{% endblock %}

{% block extra_css %}
<style>
  .auth-container {
    max-width: 440px;
    margin: 60px auto;
  }

  .auth-card {
    background: #ffffff;
    border-radius: 20px;
    border: 1px solid #e2e8f0;
    box-shadow: var(--card-shadow);
    padding: 40px;
  }

  .auth-title {
    font-weight: 800;
    color: var(--primary-color);
    letter-spacing: -0.5px;
    margin-bottom: 8px;
    text-align: center;
  }
</style>
{% endblock %}

{% block content %}

  <div class="container">
    <div class="auth-container">
      <div class="auth-card">
        
        <h2 class="auth-title">Welcome Back</h2>
        <p class="text-muted text-center mb-4">Login to manage bookings and request vehicle rentals.</p>

        <form method="POST">
          {% csrf_token %}
          
          <div class="mb-3">
            <label for="id_username" class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control py-2 fs-6" id="id_username" placeholder="Enter your username" required autocomplete="username">
          </div>

          <div class="mb-4">
            <label for="id_password" class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control py-2 fs-6" id="id_password" placeholder="Enter password" required autocomplete="current-password">
          </div>

          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-custom-primary btn-lg py-2 fs-6">Sign In</button>
          </div>

          <div class="text-center">
            <span class="text-muted fs-6">Don't have an account? <a href="{% url 'register' %}" class="text-primary text-decoration-none fw-semibold">Register here</a></span>
          </div>

        </form>

      </div>
    </div>
  </div>

{% endblock %}
